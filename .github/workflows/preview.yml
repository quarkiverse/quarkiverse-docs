name: Surge.sh Preview

# Privileged half of the preview deploy, triggered by "Publish website".
#
# `workflow_run` always runs the workflow file from the default branch, so the
# Surge token and the write-enabled token are never exposed to pull request
# code. Anything coming from the triggering run is untrusted input.

on:
  workflow_run:
    workflows: [ "Publish website" ]
    types:
      - completed

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read        # Required to download the artifacts of the triggering run
      pull-requests: write # Required to update PR status comment
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download PR id artifact
        uses: actions/download-artifact@v8
        with:
          name: pr-id
          path: ${{ runner.temp }}/pr
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read PR id
        id: pr
        env:
          PR_ID_FILE: ${{ runner.temp }}/pr/pr-id.txt
        run: |
          # "Publish website" runs on pull_request, so a fork controls the
          # workflow file that produced this artifact. The id is validated
          # before it reaches a command or an API call.
          id=$(head -c 32 "$PR_ID_FILE" | tr -d '[:space:]')
          if [[ ! $id =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::Unexpected PR id in artifact: '${id}'"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Publishing to surge for preview
        env:
          PR_ID: ${{ steps.pr.outputs.id }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx surge ./site --domain "https://quarkiverse-docs-pr-${PR_ID}-preview.surge.sh" --token "$SURGE_TOKEN"

      - name: Update PR status comment on success
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            🚀 PR Preview ${{ github.event.workflow_run.head_sha }} has been successfully built and deployed to https://quarkiverse-docs-pr-${{ steps.pr.outputs.id }}-preview.surge.sh

            <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">
          body-marker: <!-- Preview status comment marker -->

      - name: Update PR status comment on failure
        uses: quarkusio/action-helpers@main
        # Skipped when the PR id itself could not be resolved, since there is
        # then no PR to comment on.
        if: failure() && steps.pr.outputs.id != ''
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.id }}
          body: |
            😭 Deploy PR Preview failed. [See the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
          body-marker: <!-- Preview status comment marker -->
