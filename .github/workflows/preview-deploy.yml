name: Preview deploy

# Privileged half of the PR preview, triggered by "Preview build".
#
# `workflow_run` always runs the workflow file from the default branch, so the
# Surge token and the write-enabled token are never exposed to pull request
# code. Everything coming from the triggering run is untrusted input.
#
# Extension repositories can call this as a reusable workflow from their own
# workflow_run workflow; see preview/README.md.

on:
  workflow_run:
    workflows: [ "Preview build" ]
    types:
      - completed
    # PRs opened from a fork's main branch are not previewed.
    branches-ignore:
      - 'main'
  workflow_call:
    inputs:
      site-name:
        description: Surge sites are published as <site-name>-pr-<number>-preview.surge.sh. Defaults to <repository name>-docs.
        type: string
        required: false
    secrets:
      SURGE_TOKEN:
        required: true

defaults:
  run:
    shell: bash

jobs:
  preview:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read        # Required to download the site artifact of the triggering run
      pull-requests: write # Required to look up the PR and update its status comment
    steps:
      - name: Identify the PR
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SITE_NAME: ${{ inputs.site-name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # The PR comes from the workflow_run metadata rather than from anything
          # the build uploaded, because a fork controls the build workflow and
          # could otherwise claim to be any PR.
          #
          # workflow_run.pull_requests is empty for PRs from forks, so those are
          # looked up from the branch the build ran on. All states are searched
          # so that closed PRs are found for teardown, preferring the PR whose
          # head is the commit that was built.
          id=$RAW_PR_NUMBER
          if [[ -z $id ]]; then
            id=$(gh api -X GET "repos/${REPOSITORY}/pulls" \
              -f state=all -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f per_page=100 \
              --jq "(map(select(.head.sha == \"${HEAD_SHA}\")) + .)[0].number // empty")
          fi
          if [[ ! $id =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::Could not identify the PR for ${HEAD_OWNER}:${HEAD_BRANCH} (${HEAD_SHA}): '${id}'"
            exit 1
          fi

          # A closed PR (or a build that finished after the PR was closed) tears the preview down.
          state=$(gh api "repos/${REPOSITORY}/pulls/${id}" --jq .state)
          if [[ $state == open ]]; then action=deploy; else action=teardown; fi
          echo "PR #${id} is ${state}: ${action}"

          if [[ -z $SITE_NAME ]]; then
            if [[ $REPOSITORY == quarkiverse/quarkiverse-docs ]]; then
              SITE_NAME=quarkiverse-docs
            else
              SITE_NAME="${REPOSITORY_NAME,,}-docs"
            fi
          fi
          domain="${SITE_NAME}-pr-${id}-preview.surge.sh"
          if [[ ! $SITE_NAME =~ ^[a-z0-9-]+$ || ${#domain} -gt 72 ]]; then
            echo "::error::Invalid Surge domain '${domain}', set a shorter site-name"
            exit 1
          fi

          {
            echo "id=$id"
            echo "action=$action"
            echo "domain=$domain"
          } >> "$GITHUB_OUTPUT"

      - name: Download site
        if: steps.meta.outputs.action == 'deploy'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish to Surge
        if: steps.meta.outputs.action == 'deploy'
        env:
          DOMAIN: ${{ steps.meta.outputs.domain }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          du -sh site
          npx --yes surge@0.24.6 ./site --domain "https://${DOMAIN}" --token "$SURGE_TOKEN"

      - name: Update PR status comment on success
        if: steps.meta.outputs.action == 'deploy'
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.meta.outputs.id }}
          body: |
            🚀 PR Preview ${{ github.event.workflow_run.head_sha }} has been successfully built and deployed to https://${{ steps.meta.outputs.domain }}

            ✂️ To keep the preview small, only the latest version of each extension is included (apart from anything this PR changes), and large images are loaded from docs.quarkiverse.io.

            <img width="300" src="https://user-images.githubusercontent.com/507615/90250366-88233900-de6e-11ea-95a5-84f0762ffd39.png">
          body-marker: <!-- Preview status comment marker -->

      - name: Teardown Surge preview
        if: steps.meta.outputs.action == 'teardown'
        env:
          DOMAIN: ${{ steps.meta.outputs.domain }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: npx --yes surge@0.24.6 teardown "https://${DOMAIN}" --token "$SURGE_TOKEN" || true

      - name: Update PR status comment on teardown
        if: steps.meta.outputs.action == 'teardown'
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.meta.outputs.id }}
          body: |
            🧹 The PR is closed and the preview is expired.
          body-marker: <!-- Preview status comment marker -->

      - name: Update PR status comment on failure
        # Skipped when the PR id itself could not be read, since there is then no PR to comment on.
        if: failure() && steps.meta.outputs.id != ''
        uses: quarkusio/action-helpers@main
        with:
          action: maintain-one-comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.meta.outputs.id }}
          body: |
            💥 Deploy PR Preview failed. [See the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            <img width="300" src="https://user-images.githubusercontent.com/507615/90250824-4e066700-de6f-11ea-8230-600ecc3d6a6b.png">
          body-marker: <!-- Preview status comment marker -->
